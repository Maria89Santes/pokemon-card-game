<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-pok">Pokémon</span><span class="logo-tcg">TCG</span>
      </div>
      <h2 class="auth-title">Crear Entrenador</h2>
      <p class="auth-subtitle">Regístrate para recibir tus primeras cartas y entrar a la arena</p>
    </div>

    <!-- Alertas de Error -->
    <div class="alert-box error" *ngIf="errorMessage">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Alertas de Éxito -->
    <div class="alert-box success" *ngIf="successMessage">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Formulario (Se oculta al completarse con éxito) -->
    <form class="auth-form" (ngSubmit)="onSubmit()" *ngIf="!successMessage || successMessage.includes('Redirigiendo')">
      <!-- Nombre de Usuario -->
      <div class="form-group">
        <label for="username" class="form-label">Nombre de Entrenador (Username)</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="username" 
          class="form-input" 
          placeholder="Ej: AshKetchum99" 
          required
          [disabled]="loading"
        >
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          class="form-input" 
          placeholder="ejemplo@entrenador.com" 
          required
          [disabled]="loading"
        >
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          class="form-input" 
          placeholder="Mínimo 6 caracteres" 
          required
          [disabled]="loading"
        >
      </div>

      <button type="submit" class="btn-auth" [disabled]="loading">
        <span *ngIf="!loading">Registrar Entrenador</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <span>¿Ya tienes una cuenta?</span>
      <a routerLink="/login" class="auth-link">Inicia sesión</a>
    </div>
  </div>
</div>
